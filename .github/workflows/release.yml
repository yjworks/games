name: Release

# v 로 시작하는 태그를 올리면 그 커밋을 검사·빌드해 GitHub Release 를 만들고 빌드본(dist.zip)을 붙인다.
# 사이트 배포는 여기서 하지 않는다(블로그 저장소의 hugo.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test
      - name: Build
        run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../games-${GITHUB_REF_NAME}.zip" .)
          gh release create "$GITHUB_REF_NAME" "games-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
